# Simulation parameters. Public data only; no restricted-use inputs.
# Sources are named per parameter so every number in the output is traceable.

percentiles: [10, 25, 50, 75, 90]

cells:
  - {subject: reading,     grade: 4,  subscale: RRPCM, label: "Reading G4"}
  - {subject: reading,     grade: 8,  subscale: RRPCM, label: "Reading G8"}
  - {subject: reading,     grade: 12, subscale: RRPCM, label: "Reading G12"}
  - {subject: mathematics, grade: 4,  subscale: MRPCM, label: "Math G4"}
  - {subject: mathematics, grade: 8,  subscale: MRPCM, label: "Math G8"}
  - {subject: mathematics, grade: 12, subscale: MWPCM, label: "Math G12"}   # 0-300 scale, NOT MRPCM

jurisdiction: NT      # national public + private
years: [2019, 2024]

# Treated effect sizes, in SD. phi = 1.0 (no deflation): optimistic by construction.
# Literature SDs come from restricted, lower-variance samples, so any correction
# moves conclusions the same way. See kraft-schueler-falken-2024 notes.
benchmarks:
  - {id: tut_scale,   g: 0.155, label: "Tutoring, programs >=1000 students",  source: "kraft-schueler-falken-2024 Table 5 (n.s.)"}
  - {id: tut_mid,     g: 0.214, label: "Tutoring, programs 400-999 students", source: "kraft-schueler-falken-2024 Table 5"}
  - {id: summer_math, g: 0.100, label: "Summer programs, math",               source: "lynch-an-mancenido-2022 Table 2"}
  - {id: summer_real, g: 0.027, label: "Summer, realized post-COVID",         source: "callen-etal-2025 / morton-etal-2025"}

# Participation rates: the share of a percentile's students who actually
# take part in the intervention. Not the same as eligibility.
participation:
  - {id: universal, c: 1.000, label: "Universal, full participation",  source: "definitional"}
  - {id: hdt_dist,  c: 0.280, label: "District HDT participation", source: "kraft-schueler-falken-2024 p.14 (NCES SPP)"}
  - {id: optin,     c: 0.187, label: "Opt-in tutoring take-up",    source: "robinson-bisht-loeb-2025"}
  - {id: summer,    c: 0.130, label: "Summer program reach",       source: "callen-etal-2025"}

# Differential take-up by achievement (arm A3). Struggling students opt in at
# roughly half the rate of passing students.
optin_takeup:
  struggling: 0.116
  passing:    0.227
  source: "robinson-bisht-loeb-2025"

# Kraft (2020) empirical distribution of education RCT effect sizes, for benchmarking
# the REQUIRED effect against what interventions actually deliver.
kraft2020_effect_percentiles:
  p10: -0.08
  p25:  0.00
  p50:  0.10
  p75:  0.25
  p90:  0.47
  source: "kraft-2020 Table 1, 1942 effects from 747 RCTs"

# Table 2 column (a) of the companion AERA Open article (naep-aera-open): differential change from the restricted-use
# analysis. Used only as a validation target -- the script must reproduce these
# from public data, which is what licenses using public data for the simulations.
table2a_diff_change:
  "Reading G4":  8.7
  "Reading G8":  7.0
  "Reading G12": 1.5
  "Math G4":     7.9
  "Math G8":     6.4
  "Math G12":    4.5
