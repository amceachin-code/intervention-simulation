# Simulation parameters. Public data only; no restricted-use inputs.
# Sources are named per parameter so every number in the output is traceable.

percentiles: [10, 25, 50, 75, 90]

cells:
  - {subject: reading,     grade: 4,  subscale: RRPCM, label: "Reading G4"}
  - {subject: reading,     grade: 8,  subscale: RRPCM, label: "Reading G8"}
  - {subject: reading,     grade: 12, subscale: RRPCM, label: "Reading G12"}
  - {subject: mathematics, grade: 4,  subscale: MRPCM, label: "Math G4"}
  - {subject: mathematics, grade: 8,  subscale: MRPCM, label: "Math G8"}
  - {subject: mathematics, grade: 12, subscale: MWPCM, label: "Math G12"}   # 0-300 scale, NOT MRPCM

jurisdiction: NT      # national public + private
# [reference year, comparison year]. 01-simulations.R queries these and
# computes comparison minus reference. The CSV columns (q2019, sd2019, sd2024)
# keep their names as a fixed schema that downstream scripts read.
years: [2019, 2024]

# Each benchmark and participation entry has a `source` (a bib key plus
# location, for the pipeline) and a `cite` (the readable citation the
# explorer's methods page shows; checked against the PDFs 2026-09-28).

# Treated effect sizes, in SD. phi = 1.0 (no deflation): optimistic by construction.
# Literature SDs come from restricted, lower-variance samples, so any correction
# moves conclusions the same way. See kraft-schueler-falken-2024 notes.
benchmarks:
  - {id: tut_scale,   g: 0.155, label: "Tutoring, programs >=1000 students",  source: "kraft-schueler-falken-2024 Table 5 (n.s.)",
     cite: "Kraft, Schueler, & Falken (2024), Table 5: U.S. programs, standardized tests; not statistically significant"}
  - {id: tut_mid,     g: 0.214, label: "Tutoring, programs 400-999 students", source: "kraft-schueler-falken-2024 Table 5",
     cite: "Kraft, Schueler, & Falken (2024), Table 5: U.S. programs, standardized tests"}
  - {id: summer_math, g: 0.100, label: "Summer programs, math",               source: "lynch-an-mancenido-2022 Table 2",
     cite: "Lynch, An, & Mancenido (2022), Table 2: math only"}
  - {id: summer_real, g: 0.027, label: "Summer, realized post-COVID",         source: "callen-etal-2025 / morton-etal-2025",
     cite: "Callen et al. (2025), Table 6; Morton et al. (2025): math, students who attended"}

# Participation rates: the share of a percentile's students who actually
# take part in the intervention. Not the same as eligibility.
participation:
  - {id: universal, c: 1.000, label: "Universal, full participation",  source: "definitional",
     cite: "Every student takes part"}
  - {id: hdt_dist,  c: 0.280, label: "District HDT participation", source: "kraft-schueler-falken-2024 p.14 (NCES SPP)",
     cite: "NCES School Pulse Panel, via Kraft, Schueler, & Falken (2024), p. 14"}
  - {id: optin,     c: 0.187, label: "Opt-in tutoring take-up",    source: "robinson-bisht-loeb-2025",
     cite: "Robinson, Bisht, & Loeb (2025): students offered free online tutoring"}
  - {id: summer,    c: 0.130, label: "Summer program reach",       source: "callen-etal-2025",
     cite: "Callen et al. (2025): 12.7 percent, rounded"}

# The treated effect applied wherever the pipeline needs ONE program effect:
# 01-simulations.R Table C3, the seat allocation (06), the tail sensitivity
# (07), and tests/test-sim.R. Names a benchmark id above, so the number itself
# lives in one place. tut_scale is the best-evidenced tutoring effect at
# national scale.
treated_effect: tut_scale

# Program points on the district requirements figure (04-district-requirements.R).
# Each pairs a benchmark effect (g_id) with a participation rate (c_id) by id.
district_requirements_points:
  - {label: "Tutoring, >=1000 students",   g_id: tut_scale,   c_id: hdt_dist}
  - {label: "Tutoring, 400-999 students",  g_id: tut_mid,     c_id: hdt_dist}
  - {label: "Summer, meta-analytic",       g_id: summer_math, c_id: summer}
  - {label: "Summer, realized post-COVID", g_id: summer_real, c_id: summer}
  # Source UNCONFIRMED: this pairs the 400-999 tutoring effect with opt-in
  # take-up, a combination no single source reports. Kept as the script had
  # it; see the "Confirm the opt-in tutoring pairing" item in TODO.md.
  - {label: "Opt-in tutoring (ITT)",       g_id: tut_mid,     c_id: optin}

# Program points on the requirements figure (02-figures.R, figure 8). TWO
# participation denominators, not interchangeable: share_all is tutored /
# ALL students, share_targeted is tutored / students the program TARGETED.
# `basis` records which one the SOURCE reports. Each field is either a config
# id (<field>_id) or a literal; null means the source does not report it.
requirements_figure_points:
  # Callen et al. report BOTH denominators for the same program: 12.7% of all
  # students attended, and districts targeting low performers enrolled "about
  # one in four targeted students". The only point where both are measured in
  # the same study. (0.127 is the unrounded rate; participation.summer uses 0.130.)
  - {label: "Summer, realized post-COVID", g_id: summer_real, share_all: 0.127, share_targeted: 0.25,
     basis: both, src: "Callen et al. 2025"}
  # Lynch et al.'s pooled effect has NO participation rate of its own; the
  # meta-analysis could not analyze attendance. Borrowing Callen's rate is a
  # construction, so it is marked as such.
  - {label: "Summer, meta-analytic", g_id: summer_math, share_all: 0.127, share_targeted: null,
     basis: borrowed, src: "Lynch et al. 2022 effect + Callen et al. 2025 rate"}
  # Kraft/Schueler/Falken's 28% is a MODELLING ASSUMPTION used to map scale
  # bins onto national enrolment ("assuming districts tutor 28 percent of
  # their students"), not a measured participation rate. It is a share of all
  # students in a district.
  - {label: "Tutoring at scale (>=1000)", g_id: tut_scale, share_all_id: hdt_dist, share_targeted: null,
     basis: assumed, src: "Kraft/Schueler/Falken 2024 (effect n.s.)"}
  - {label: "Tutoring (400-999 students)", g_id: tut_mid, share_all_id: hdt_dist, share_targeted: null,
     basis: assumed, src: "Kraft/Schueler/Falken 2024"}
  # Carbonari et al. report shares of ELIGIBLE students. The three programs
  # with robust positive effects served 1-2 percent of eligible students; the
  # expert-teacher intervention reached 20-32 percent of eligible students.
  # Converting to a share of all students needs the eligible fraction, which
  # the notes do not give, so share_all is null and these are plotted on the
  # targeted axis only.
  - {label: "Effective tutoring (observed)", g: 0.220, share_all: null, share_targeted: 0.015,
     basis: targeted, src: "Carbonari et al. 2025 (1-2% of eligible)"}
  - {label: "Expert-teacher assignment", g: 0.060, share_all: null, share_targeted: 0.32,
     basis: targeted, src: "Carbonari et al. 2025 (32% of eligible, math)"}
  # Robinson et al. measure take-up among students OFFERED the resource, so
  # its denominator is the offered (targeted) population, not all students.
  - {label: "Opt-in tutoring take-up", g: null, share_all: null, share_targeted_id: optin,
     basis: targeted, src: "Robinson/Bisht/Loeb 2025 (take-up only, no effect)"}

# Economically disadvantaged share of the population, used by
# 05-compile-summary.R section 6b. Source UNCONFIRMED: it matches the Reading
# G4 2019 ECONDIS population share in tables/sim-bottom-decile.csv (0.5095)
# rounded, but was hardcoded without a citation. See TODO.md.
ed_population_share: 0.510

# Kraft (2020) empirical distribution of education RCT effect sizes, for benchmarking
# the REQUIRED effect against what interventions actually deliver.
kraft2020_effect_percentiles:
  p10: -0.08
  p25:  0.00
  p50:  0.10
  p75:  0.25
  p90:  0.47
  source: "kraft-2020 Table 1, 1942 effects from 747 RCTs"

# Table 2 column (a) of the companion AERA Open article (naep-aera-open): differential change from the restricted-use
# analysis. Used only as a validation target -- the script must reproduce these
# from public data, which is what licenses using public data for the simulations.
table2a_diff_change:
  "Reading G4":  8.7
  "Reading G8":  7.0
  "Reading G12": 1.5
  "Math G4":     7.9
  "Math G8":     6.4
  "Math G12":    4.5
